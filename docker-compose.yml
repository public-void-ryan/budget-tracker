# Local development database. The credentials match appsettings.Development.json
# and are for this throwaway container only; the port is bound to localhost.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
      POSTGRES_DB: budget
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
