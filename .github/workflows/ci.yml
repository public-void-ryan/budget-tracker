name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test tests/BudgetTracker.Api.Tests --no-build -c Release --verbosity normal
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build tests/BudgetTracker.E2E -c Release
      - name: Install Chromium for Playwright
        run: pwsh tests/BudgetTracker.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - run: dotnet test tests/BudgetTracker.E2E --no-build -c Release --verbosity normal
  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t budget-tracker .

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: budget
          POSTGRES_DB: budget
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budget -d budget"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CONNECTION: Host=localhost;Port=5432;Database=budget;Username=budget;Password=budget
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - run: dotnet restore
      - name: Build migration bundle
        run: dotnet ef migrations bundle --project src/BudgetTracker.Api --output efbundle --force
      - name: Apply bundle to an empty database
        run: ./efbundle --connection "$CONNECTION"
      - name: Apply again (must be a no-op)
        run: ./efbundle --connection "$CONNECTION"
      - uses: actions/upload-artifact@v7
        with:
          name: efbundle
          path: efbundle
